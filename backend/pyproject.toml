[project]
name = "tonebridge"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.0",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "httpx>=0.28.1",
    "joblib>=1.5.3",
    "kaggle>=2.2.4",
    "kagglehub>=1.0.2",
    "pandas>=3.0.5",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.14.2",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.2",
    "respx>=0.23.1",
    "scikit-learn>=1.9.0",
    "sqlmodel>=0.0.39",
    "testcontainers[postgres]>=4.15.0",
    "uvicorn[standard]>=0.52.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: DB tests needing Docker (testcontainers Postgres + pgvector)",
]
